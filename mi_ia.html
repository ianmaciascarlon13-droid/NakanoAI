
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakanoAI</title>
<style>

:root {
  --fondo: #070b0a;
  --panel: #0d1512;
  --panel-2: #111e18;
  --verde: #39ff88;
  --verde-suave: #a2ffc7;
  --texto: #edfff3;
  --texto-sec: #91a99a;
  --borde: #214a35;
}

#menuOpciones {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-bottom: 1px solid var(--borde);
  background: var(--panel);
}

#menuOpciones[hidden] {
  display: none;
}

#menuOpciones button,
#menuOpciones select {
  max-width: 100%;
}

@media (max-width: 600px) {
  #menuOpciones {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 75vw;
    max-height: 100vh;
    overflow-y: auto;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;

    padding: 80px 16px 20px;
    background: var(--panel);
    border-left: 1px solid var(--borde);
    border-radius: 0;
    z-index: 1000;
    box-shadow: -8px 0 25px #0009;
  }

  #menuOpciones button,
  #menuOpciones select {
    width: 100%;
    box-sizing: border-box;
  }
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--fondo);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at top, var(--panel-2) 0%, transparent 55%),
    var(--fondo);
  color: var(--texto);
  font-family: system-ui, -apple-system, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--borde);
  box-shadow: 0 0 18px #39ff8810;
}

header h1 {
  margin: 0;
  color: var(--verde);
  font-size: 21px;
  letter-spacing: 1px;
  text-shadow: 0 0 12px #39ff8855;
}

header button,
button {
  border: 1px solid var(--verde);
  border-radius: 12px;
  background: var(--panel-2);
  color: var(--verde-suave);
  padding: 10px 14px;
  font-weight: 600;
  cursor: pointer;
}

#chat {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 20px 14px 150px;
}

.mensaje {
  width: fit-content;
  max-width: 88%;
  margin: 14px 0;
  padding: 12px 15px;
  border: 1px solid var(--borde);
  border-radius: 17px;
  background: var(--panel-2);
  color: var(--texto);
  line-height: 1.55;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  box-shadow: 0 0 12px #39ff8808;
}

.usuario {
  margin-left: auto;
  border-color: #27844c;
  background: #123b25;
  border-bottom-right-radius: 5px;
}

.ia {
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

form,
#zona {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

form {
  position: fixed;
  z-index: 10;
  right: 0;
  bottom: 0;
  left: 0;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(7, 11, 10, 0.96);
  border-top: 1px solid var(--borde);
  box-shadow: 0 -5px 25px #0008;
}

input,
textarea {
  flex: 1;
  min-width: 0;
  border: 1px solid #28553b;
  border-radius: 15px;
  outline: none;
  padding: 13px 14px;
  background: var(--panel);
  color: var(--texto);
  font: inherit;
}

input:focus,
textarea:focus {
  border-color: var(--verde);
  box-shadow: 0 0 0 2px #39ff8820,
              0 0 15px #39ff881c;
}

input::placeholder,
textarea::placeholder {
  color: var(--texto-sec);
}

form button {
  min-height: 46px;
  background: var(--verde);
  color: #041109;
  box-shadow: 0 0 14px #39ff8840;
}

button:disabled,
input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

button:active {
  transform: scale(0.97);
}

::selection {
  background: #39ff8855;
  color: white;
}

@media (min-width: 700px) {
  #chat {
    padding-right: 24px;
    padding-left: 24px;
  }

  form {
    padding-right: max(12px, calc((100vw - 800px) / 2));
    padding-left: max(12px, calc((100vw - 800px) / 2));
  }
}

#listaConversaciones {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  color: var(--texto-sec);
}

#listaConversaciones p {
  margin: 8px 0;
  font-weight: bold;
}

#listaConversaciones button {
  width: 100%;
  overflow-wrap: anywhere;
  text-align: left;
  background: var(--panel-2);
}

#listaConversaciones button.activa {
  border-color: var(--verde);
  color: var(--verde);
}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="logo">N</div>
    <div>
      <h1>NakanoAI</h1>
      <div id="estado">Lista para conversar</div>
    </div>
  </div>

  <button type="button" id="botonMenu"
          aria-expanded="false" aria-controls="menuOpciones">
    ☰ Menú
  </button>
</header>

<nav id="menuOpciones" hidden>
<button type="button" id="cerrarMenu">✕ Cerrar menú</button>
  <button type="button" id="nuevo">
    ＋ Nueva conversación
  </button>
<div id="listaConversaciones">
  <p>Conversaciones</p>
</div>
  <button type="button" id="borrarHistorial">
    🗑 Borrar historial
  </button>

  <div class="temas">
  <span>🎨 Cambiar tema</span>

  <div class="botonesTema">
    <button type="button" class="temaBtn"
      data-tema="verde">🟢 Verde</button>

    <button type="button" class="temaBtn"
      data-tema="azul">🔵 Azul</button>

    <button type="button" class="temaBtn"
      data-tema="morado">🟣 Morado</button>
  </div>
</div>
</nav>


<main id="chat"></main>



<form id="zona">
  <input id="entrada" placeholder="Escribe un mensaje..." autocomplete="off">
  <button type="button" id="microfono">🎙️</button>
  <button type="submit">Enviar</button>
</form>


<script>
const chat = document.getElementById("chat");
const entrada = document.getElementById("entrada");
const estado = document.getElementById("estado");
const CLAVE_HISTORIAL = "mi_ia_historial_v1";
const CLAVE_MEMORIA = "mi_ia_memoria_v1";
const CLAVE_CONVERSACIONES = "nakanoai_conversaciones_v1";

let conversaciones = [];
let conversacionActivaId = null;

function guardarMemoria(nombre) {
  localStorage.setItem(CLAVE_MEMORIA, nombre);
}

function leerMemoria() {
  return localStorage.getItem(CLAVE_MEMORIA) || "";
}

const MODELO = "gemini-3.8-flash";
let historial = [];
let apiKey = "";
let enviando = false;

let controladorActual = null;
let solicitudId = 0;
function cancelarSolicitudActual() {
  solicitudId++;

  if (controladorActual) {
    controladorActual.abort();
    controladorActual = null;
  }

  enviando = false;
  entrada.disabled = false;
}

function guardar() {
  try {
    const activa = conversaciones.find(
      c => c.id === conversacionActivaId
    );

    if (activa) {
      activa.mensajes = historial;
    }

    localStorage.setItem(
      CLAVE_CONVERSACIONES,
      JSON.stringify(conversaciones)
    );

    renderizarConversaciones();
  } catch (e) {
    estado.textContent = "No se pudo guardar el historial";
  }
}

function mostrar(tipo, texto) {
  const burbuja = document.createElement("div");
  burbuja.className = "mensaje " + tipo;
  burbuja.textContent = texto;
  chat.appendChild(burbuja);
  chat.scrollTop = chat.scrollHeight;
  return burbuja;
}

function crearConversacion() {
  const nueva = {
    id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
    titulo: "Nueva conversación",
    mensajes: []
  };

  conversaciones.unshift(nueva);
  conversacionActivaId = nueva.id;
  historial = nueva.mensajes;

  chat.replaceChildren();
  mostrar("ia", "¡Nueva conversación! ¿Qué quieres preguntarme?");
  estado.textContent = "Conversación nueva";

  guardar();
}

function abrirConversacion(id) {
  if (enviando) return;

  const conversacion = conversaciones.find(c => c.id === id);
  if (!conversacion) return;

  conversacionActivaId = id;
  historial = conversacion.mensajes;

  chat.replaceChildren();

  if (historial.length === 0) {
    mostrar("ia", "¡Hola! ¿Qué quieres preguntarme?");
  } else {
    historial.forEach(m => {
      mostrar(m.role === "user" ? "usuario" : "ia", m.text);
    });
  }

  estado.textContent = conversacion.titulo;
  renderizarConversaciones();
}

function renderizarConversaciones() {
  const lista = document.getElementById("listaConversaciones");
  if (!lista) return;

  lista.replaceChildren();

  const titulo = document.createElement("p");
  titulo.textContent = "Conversaciones guardadas";
  lista.appendChild(titulo);

  conversaciones.forEach(c => {
    const boton = document.createElement("button");
    boton.type = "button";
    boton.textContent = c.titulo;
    boton.className = c.id === conversacionActivaId ? "activa" : "";
    boton.addEventListener("click", () => abrirConversacion(c.id));
    lista.appendChild(boton);
  });
}
function cargar() {
  try {
    const guardadas = JSON.parse(
      localStorage.getItem(CLAVE_CONVERSACIONES) || "null"
    );

    if (Array.isArray(guardadas)) {
      conversaciones = guardadas.filter(
        c => c && typeof c.id === "string" &&
        typeof c.titulo === "string" &&
        Array.isArray(c.mensajes)
      );
    } else {
      const antiguo = JSON.parse(
        localStorage.getItem(CLAVE_HISTORIAL) || "[]"
      );

      const mensajesAntiguos = Array.isArray(antiguo)
        ? antiguo.filter(m =>
            m &&
            (m.role === "user" || m.role === "model") &&
            typeof m.text === "string"
          )
        : [];

      conversaciones = mensajesAntiguos.length
        ? [{
            id: Date.now().toString(),
            titulo: mensajesAntiguos.find(m => m.role === "user")?.text
              .slice(0, 35) || "Conversación anterior",
            mensajes: mensajesAntiguos
          }]
        : [];
    }
  } catch (e) {
    conversaciones = [];
  }

  if (conversaciones.length === 0) {
    crearConversacion();
    return;
  }

  abrirConversacion(conversaciones[0].id);
}
async function enviarMensaje(texto) {
  if (enviando || !texto.trim()) return;
  const idSolicitud = ++solicitudId;
const idConversacion = conversacionActivaId;

  if (!apiKey) {
    const clave = prompt(
      "Pega tu clave API de Gemini. No la compartas con nadie:"
    );

    if (!clave || !clave.trim()) {
      estado.textContent = "Falta la clave API";
      return;
    }

    apiKey = clave.trim();
  }

  enviando = true;
  entrada.disabled = true;
  estado.textContent = "Gemini está pensando...";

  historial.push({ role: "user", text: texto });

const activa = conversaciones.find(
  c => c.id === conversacionActivaId
);

if (activa && activa.titulo === "Nueva conversación") {
  activa.titulo = texto.length > 35
    ? texto.slice(0, 35) + "…"
    : texto;
}

mostrar("usuario", texto);
guardar();
  const coincidenciaNombre = texto.match(
  /\b(?:me llamo|mi nombre es)\s+([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/i
);

if (coincidenciaNombre) {
  guardarMemoria(coincidenciaNombre[1]);
}

  const burbuja = mostrar("ia", "Pensando...");
  let respuestaRecibida = false;
let temporizador;
  try {
    const nombreGuardado = leerMemoria();

const instruccionesMemoria = nombreGuardado
  ? "El nombre del usuario es " + nombreGuardado +
    ". Si pregunta cómo se llama, responde con ese nombre."
  : "Todavía no sabes el nombre del usuario.";

const fechaActual = new Date().toLocaleString("es-MX", {
  dateStyle: "full",
  timeStyle: "short"
});
const contenidos = [
  {
    role: "user",
    parts: [{
      text: "Contexto: " + instruccionesMemoria +
  "\nFecha y hora actual del dispositivo: " + fechaActual +
  ". Si preguntan la hora o la fecha, responde usando estos datos."
    }]
  },
  ...historial.slice(-30).map(m => ({
    role: m.role,
    parts: [{ text: m.text }]
  }))
];

let respuesta;
let datos;
let ultimoError;

for (let intento = 0; intento < 3; intento++) {
  if (
    idSolicitud !== solicitudId ||
    idConversacion !== conversacionActivaId
  ) {
    return;
  }
  const controlador = new AbortController();
  controladorActual = controlador;
  const temporizador = setTimeout(
    () => controlador.abort(),
    25000
  );

  try {
    respuesta = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" +
        MODELO + ":generateContent",
      {
        method: "POST",
        signal: controlador.signal,
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          contents: contenidos,
          generationConfig: {
            maxOutputTokens: 300,
            thinkingConfig: {
              thinkingLevel: "low"
            }
          }
        })
      }
    );

    datos = await respuesta.json();
    if (
  idSolicitud !== solicitudId ||
  idConversacion !== conversacionActivaId
) {
  return;
}

    if (respuesta.ok) {
      break;
    }

    if (![408, 429, 500, 502, 503, 504].includes(respuesta.status)) {
      throw new Error(
        datos.error?.message || "Error HTTP " + respuesta.status
      );
    }

    ultimoError = new Error(
      datos.error?.message || "Error temporal " + respuesta.status
    );
  } catch (error) {
  if (
    idSolicitud !== solicitudId ||
    idConversacion !== conversacionActivaId
  ) {
    return;
  }

  ultimoError = error;

  if (error.name !== "AbortError" &&
      error.name !== "TypeError") {
    throw error;
  }
} finally {
  clearTimeout(temporizador);
}

if (intento < 2) {
  await new Promise(resolve =>
    setTimeout(resolve, 1500 * (intento + 1))
  );
}
}

if (!respuesta?.ok) {
  throw ultimoError || new Error(
    datos?.error?.message || "No se pudo conectar con Gemini."
  );
}


    if (!respuesta.ok) {
      throw new Error(
        datos?.error?.message ||
        "Error HTTP " + respuesta.status
      );
    }

    const respuestaIA = (
      datos.candidates?.[0]?.content?.parts || []
    )
      .map(p => p.text || "")
      .join("")
      .trim();

    if (!respuestaIA) {
      throw new Error(
        "Gemini no devolvió texto. Intenta otra vez."
      );
    }

    burbuja.textContent = respuestaIA;
    hablarRespuesta(respuestaIA);
    historial.push({ role: "model", text: respuestaIA });
   guardar();

    respuestaRecibida = true;
    estado.textContent = "Conectada a Gemini";
} catch (error) {
  if (
    idSolicitud !== solicitudId ||
    idConversacion !== conversacionActivaId
  ) {
    return;
  }

  burbuja.textContent = "No pude conectar..." + error.message;
  estado.textContent = "Error de conexión";
  console.error(error);

  if (!respuestaRecibida) {
    historial.pop();
    guardar();
  }
} finally {
  if (idSolicitud === solicitudId) {
    controladorActual = null;
    enviando = false;
    entrada.disabled = false;
    entrada.focus();
  }
}
}
document.getElementById("zona").addEventListener("submit", e => {

const botonMicrofono = document.getElementById("microfono");

const ReconocimientoVoz =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (ReconocimientoVoz) {
  const reconocimiento = new ReconocimientoVoz();

  reconocimiento.lang = "es-MX";
  reconocimiento.continuous = false;
  reconocimiento.interimResults = false;

  botonMicrofono.addEventListener("click", () => {
    if (enviando) return;

    botonMicrofono.textContent = "🎙️...";
    estado.textContent = "Te estoy escuchando...";

    try {
      reconocimiento.start();
    } catch (error) {
      estado.textContent = "Espera un momento e inténtalo otra vez.";
      botonMicrofono.textContent = "🎙️";
    }
  });

  reconocimiento.onresult = (evento) => {
    entrada.value = evento.results[0][0].transcript;
    estado.textContent = "Voz reconocida. Pulsa Enviar.";
  };

  
reconocimiento.onerror = (evento) => {
  estado.textContent = "Error de voz: " + evento.error;
  console.log("Error de reconocimiento:", evento.error);
};


  reconocimiento.onend = () => {
    botonMicrofono.textContent = "🎙️";
  };
} else {
  botonMicrofono.addEventListener("click", () => {
    estado.textContent =
      "Tu navegador no admite el reconocimiento de voz.";
  });
}

  e.preventDefault();

  const texto = entrada.value.trim();
  if (!texto || enviando) return;

  entrada.value = "";
  enviarMensaje(texto);
});

document.getElementById("nuevo").addEventListener("click", () => {
  cancelarSolicitudActual();
  crearConversacion();

  menuOpciones.hidden = true;
  botonMenu.setAttribute("aria-expanded", "false");
});
const botonMenu = document.getElementById("botonMenu");
const menuOpciones = document.getElementById("menuOpciones");

document.getElementById("cerrarMenu").addEventListener("click", () => {
  menuOpciones.hidden = true;
  botonMenu.setAttribute("aria-expanded", "false");
});

botonMenu.addEventListener("click", () => {
  menuOpciones.hidden = !menuOpciones.hidden;
  botonMenu.setAttribute(
    "aria-expanded",
    String(!menuOpciones.hidden)
  );
});
cargar();

const temas = {
  verde: {
    verde: "#39ff88",
    suave: "#a2ffc7",
    borde: "#214a35",
    panel: "#0d1512",
    panel2: "#111e18",
    fondo: "#070b0a"
  },
  azul: {
    verde: "#38bdf8",
    suave: "#bae6fd",
    borde: "#164e63",
    panel: "#0b141b",
    panel2: "#10212c",
    fondo: "#050a10"
  },
  morado: {
    verde: "#c084fc",
    suave: "#e9d5ff",
    borde: "#581c87",
    panel: "#160d20",
    panel2: "#241332",
    fondo: "#09050d"
  }
};

function aplicarTema(nombre) {
  const tema = temas[nombre];
  if (!tema) return;

  const raiz = document.documentElement;
  raiz.style.setProperty("--verde", tema.verde);
  raiz.style.setProperty("--verde-suave", tema.suave);
  raiz.style.setProperty("--borde", tema.borde);
  raiz.style.setProperty("--panel", tema.panel);
  raiz.style.setProperty("--panel-2", tema.panel2);
  raiz.style.setProperty("--fondo", tema.fondo);

  localStorage.setItem("nakanoai_tema", nombre);
}


const temaGuardado =
  localStorage.getItem("nakanoai_tema") || "verde";

aplicarTema(temaGuardado);
document.querySelectorAll(".temaBtn").forEach(boton => {
  boton.addEventListener("click", () => {
    aplicarTema(boton.dataset.tema);
  });
});
function hablarRespuesta(texto) {
  if (!("speechSynthesis" in window)) {
    mostrar("ia", "Tu navegador no admite lectura en voz alta.");
    return;
  }

  window.speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "es-MX";
  voz.rate = 1;
  voz.pitch = 1.15;

  window.speechSynthesis.speak(voz);
}
document.getElementById("borrarHistorial").addEventListener("click", () => {
  const confirmar = confirm(
    "¿Quieres borrar todas las conversaciones guardadas?"
  );

  if (!confirmar) return;

  cancelarSolicitudActual();

  conversaciones = [];
  historial = [];

  localStorage.removeItem(CLAVE_CONVERSACIONES);
  localStorage.removeItem(CLAVE_HISTORIAL);

  crearConversacion();

  menuOpciones.hidden = true;
  botonMenu.setAttribute("aria-expanded", "false");
});
</script>
</body>
</html>
